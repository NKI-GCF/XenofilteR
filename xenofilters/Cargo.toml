[package]
name = "xenofilters"
version = "0.1.0"
edition = "2024"
description = "Fast alignment-based classifier / filter for xenograft (PDX) sequencing data — decides per read/fragment which species alignment is best"
authors = ["Roel Kluin <r.kluin@nki.nl>"]
homepage = "https://github.com/NKI-GCF/XenofilteR/tree/master"
repository = "https://github.com/NKI-GCF/XenofilteR/tree/master"
readme = "README.md"
license = "GPL-3.0"
keywords = ["bioinformatics", "xenograft", "pdx", "bam", "read-filtering"]
categories = ["science", "command-line-utilities"]

[package.metadata]
MAX_ALN = "4"

[dependencies]
clap               = { version = "4.6.1", features = ["derive"] }
anyhow             = "1.0.102"
smallvec           = "1.15.1"
thiserror          = "2.0.18"
noodles            = { version = "0.111.0", features = ["bam", "cram", "async", "vcf", "sam", "bcf", "bgzf", "core"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam-channel  = "0.5"   # bounded MPSC channels for work/result queues

[[bin]]
name = "xenofilters"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration_test.rs"
