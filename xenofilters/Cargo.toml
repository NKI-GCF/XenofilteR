[package]
name = "xenofilters"
version = "0.2.1"
edition = "2024"
description = "Fast alignment-based classifier / filter for xenograft (PDX) sequencing data — decides per read/fragment which species alignment is best"
authors = ["Roel Kluin <r.kluin@nki.nl>"]
homepage = "https://github.com/NKI-GCF/XenofilteR/tree/master"
repository = "https://github.com/NKI-GCF/XenofilteR/tree/master"
readme = "README.md"
license = "GPL-3.0"
keywords = ["bioinformatics", "xenograft", "pdx", "bam", "read-filtering"]
categories = ["science", "command-line-utilities"]

[package.metadata]
MAX_ALN = "4"

[dependencies]
ahash              = "0.8"
indicatif          = "0.18"
clap               = { version = "^4.6", features = ["derive", "env", "wrap_help"] }
smallvec           = { version = "1.15", features = ["const_generics", "union"] }
thiserror          = "2.0.18"
noodles            = { version = "0.111", features = ["async", "bam", "bed", "bcf", "bgzf", "core", "cram", "csi", "sam", "tabix", "vcf", "cram", "fasta"] }
serde              = { version = "1", features = ["derive", "rc"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
crossbeam-channel  = "0.5"   # bounded MPSC channels for work/result queues
clap_complete = "4.6"

[lib]
name    = "xenofilters"
path    = "src/lib.rs"

[[bin]]
name = "xenofilters"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration_test.rs"

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"

[[bench]]
name    = "scoring"
harness = false

[[bench]]
name    = "fragment_table"
harness = false

[features]
default         = []
bench-internals = []
nu-completion = [] #"clap/nu-completion"
