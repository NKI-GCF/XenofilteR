[package]
name = "xenofilter"
version = "0.1.0"
edition = "2024"
description = "Fast alignment-based classifier / filter for xenograft (PDX) sequencing data — decides per read/fragment which species alignment is best"
authors = ["Roel Kluin <r.kluin@nki.nl>"]
homepage = "https://github.com/NKI-GCF/XenofilteR/tree/rust"
repository = "https://github.com/NKI-GCF/XenofilteR/tree/rust"
readme = "xenofilters/README_rust.md"
license = "GPL-3.0"
keywords = ["bioinformatics", "xenograft", "pdx", "bam", "read-filtering"]
categories = ["science", "command-line-utilities"]

[package.metadata]
MAX_ALN = "4"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.102"
smallvec = "1.15.1"
thiserror = "2.0.18"
noodles = { version = "0.111.0", features = ["bam", "cram", "async", "vcf", "sam", "bcf", "bgzf"] }

[[bin]]
name = "xenofilter"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration_test.rs"
